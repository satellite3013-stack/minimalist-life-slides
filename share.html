  <style>
    /* === THEME TOKENS === */
    :root {
      --stage-bg: #22211f;
      --slide-bg: #ffffff;
      --ink: #171513;
      --muted: #756f67;
      --orange: #f36c21;
      --orange-pale: #ffd8bc;
      --line: #d8d0c5;
      --font-display: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --font-body: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --title-size: 74px;
      --body-primary: 44px;
      --body-secondary: 33px;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-normal: 1.5s;
      --live-safe-scale: .85;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===========================================
       FIXED 16:9 STAGE: MANDATORY BASE STYLES
       Include this ENTIRE file in every presentation.
       Slides are authored at 1920×1080 and scaled as a whole.
       =========================================== */

    /* 1. Lock the browser viewport */
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--stage-bg, #000);
    }

    /* 2. Full-window deck viewport */
    .deck-viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 3. Fixed 16:9 design canvas.
       JavaScript sets transform: translate(...) scale(...). */
    .deck-stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
        background: var(--slide-bg, #fff);
    }

    /* 4. Slides stack inside the fixed stage.
       Content must be laid out at 1920×1080, not reflowed per device. */
    .slide {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: block;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        background: var(--slide-bg, #fff);
        transform: scale(var(--live-safe-scale));
        transform-origin: center center;
    }

    .slide.active,
    .slide.visible {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        z-index: 1;
    }

    /* 5. Keep media inside authored slide bounds */
    img,
    video,
    canvas,
    svg {
        max-width: 100%;
        max-height: 100%;
    }

    /* 6. Print one fixed-size slide per page */
    @media print {
        html,
        body {
            width: 1920px;
            height: auto;
            overflow: visible;
            background: #fff;
        }

        .deck-viewport {
            position: static;
            overflow: visible;
            background: #fff;
        }

        .deck-stage {
            position: static;
            width: auto;
            height: auto;
            transform: none !important;
            background: none;
        }

        .slide {
            position: relative;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            width: 1920px;
            height: 1080px;
            break-after: page;
            page-break-after: always;
        }

        .slide:last-child {
            break-after: auto;
            page-break-after: auto;
        }

    }

    /* 7. Reduced motion */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.2s !important;
        }
    }

    /* === BASE SLIDE TYPOGRAPHY AND BRAND === */
    body { font-family: var(--font-body); color: var(--ink); }
    .slide-shell { position: absolute; inset: 0; padding: 104px 150px 105px; }
    .content-header { display: flex; align-items: center; gap: 30px; width: 1490px; min-height: 78px; }
    .content-header.stacked-header { display: block; width: 1490px; min-height: 210px; margin-top: -34px; }
    .brand-logo { position: absolute; right: 222px; top: 173px; width: 145px; height: 55px; z-index: 20; background-repeat: no-repeat; background-position: center; background-size: contain; }
    .brand-logo.stacked { top: 127px; }
    .brand-logo.hidden { display: none; }
    .eyebrow { flex: 0 0 auto; padding-right: 30px; border-right: 3px solid var(--orange); font-size: 33px; line-height: 1.2; font-weight: 800; color: var(--orange); letter-spacing: .08em; white-space: nowrap; }
    .slide-title { max-width: 1320px; margin-top: 0; font-size: var(--title-size); line-height: 1.05; font-weight: 900; letter-spacing: -.045em; word-break: normal; overflow-wrap: normal; line-break: strict; text-wrap: balance; }
    .slide-title.long { max-width: 1450px; font-size: var(--title-size); line-height: 1.08; }
    .mobile-title { display: none; }
    .stacked-header .eyebrow { display: inline-block; }
    .stacked-header .slide-title { margin-top: 28px; }
    .primary { font-size: var(--body-primary); line-height: 1.35; font-weight: 800; }
    .secondary { font-size: var(--body-secondary); line-height: 1.5; color: var(--muted); }
    .orange { color: var(--orange); }
    .muted { color: var(--muted); }
    .rule { height: 3px; background: var(--ink); }
    .accent-rule { height: 7px; width: 56px; border-radius: 999px; background: var(--orange); }
    .icon { width: 78px; height: 78px; color: var(--orange); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* === CALM ENTRANCE ANIMATIONS === */
    .reveal, .reveal-left { opacity: 0; transform: translateY(26px); transition: opacity var(--duration-normal) var(--ease-out-expo), transform var(--duration-normal) var(--ease-out-expo); transition-delay: var(--delay, 0s); }
    .reveal-scale { opacity: 0; transform: scale(.94); transition: opacity var(--duration-normal) var(--ease-out-expo), transform var(--duration-normal) var(--ease-out-expo); transition-delay: var(--delay, 0s); }
    .slide.visible .reveal, .slide.visible .reveal-left, .slide.visible .reveal-scale { opacity: 1; transform: none; }
    .slide.exit-left, .slide.exit-right { opacity: 0; transform: scale(var(--live-safe-scale)) translateY(20px); transition: opacity 1.5s ease, transform 1.5s ease; }

    /* === COVER === */
    .cover .slide-shell { padding: 0; }
    .cover-content { position: absolute; left: 150px; top: 250px; width: 1080px; }
    .cover-kicker { font-size: 29px; color: var(--orange); font-weight: 800; letter-spacing: .20em; }
    .cover-title { margin-top: 44px; font-size: 145px; line-height: .98; font-weight: 900; letter-spacing: -.06em; }
    .cover-subtitle { margin-top: 40px; font-size: 44px; line-height: 1.45; font-weight: 500; }
    .cover-promise { margin-top: 74px; display: flex; align-items: center; gap: 22px; font-size: 33px; color: #4f4a43; }
    .cover-promise::before { content: ""; width: 72px; height: 6px; border-radius: 99px; background: var(--orange); }
    .cover-shape { position: absolute; right: 70px; top: 190px; width: 460px; height: 720px; border-radius: 240px; background: var(--orange); }
    .cover-shape::before { content: ""; position: absolute; width: 330px; height: 330px; left: 63px; top: 193px; border: 2px solid rgba(255,255,255,.72); border-radius: 50%; }
    .cover-shape::after { content: "−"; position: absolute; left: 118px; top: 138px; width: 220px; color: #fff; font-size: 230px; line-height: 1; text-align: center; font-weight: 200; }
    .cover-micro { position: absolute; right: 150px; bottom: 250px; color: rgba(255,255,255,.88); font-size: 20px; letter-spacing: .16em; writing-mode: vertical-rl; }

    /* === INTERACTION AND CHOICE SLIDES === */
    .choice-grid { position: absolute; left: 150px; right: 150px; top: 315px; display: grid; grid-template-columns: repeat(var(--cols, 5), 1fr); gap: 32px; }
    .choice-item { min-height: 410px; padding-top: 0; }
    .choice-item .choice-number { margin-top: 0; color: var(--orange-pale); font-size: 123px; font-weight: 900; line-height: 1; }
    .choice-item .choice-number::before { content: ""; display: block; height: 3px; margin: 36px 0 34px; background: var(--line); }
    .choice-item .primary { margin-top: 24px; }
    .interaction-prompt { position: absolute; left: 150px; bottom: 145px; font-size: 33px; color: var(--orange); font-weight: 800; }
    .interaction-board { position: absolute; left: 150px; right: 150px; top: 430px; height: 255px; display: flex; align-items: center; justify-content: center; gap: 22px; border: 3px dashed #9b9790; background: rgba(243,108,33,.018); color: var(--muted); }
    .interaction-board .icon { width: 42px; height: 42px; color: var(--orange); }
    .interaction-board-text { font-size: 38px; line-height: 1.4; font-weight: 700; letter-spacing: .01em; }

    /* === TWO-COLUMN STORY / CONTRAST === */
    .dual-grid { position: absolute; left: 150px; right: 150px; top: 350px; display: grid; grid-template-columns: 1fr 170px 1fr; align-items: stretch; }
    .story > .secondary { position: absolute; left: 150px; right: 150px; top: 255px; font-size: 33px; }
    .dual-panel { padding-top: 38px; border-top: 3px solid var(--ink); min-height: 420px; }
    .dual-panel .panel-label { font-size: 33px; color: var(--orange); font-weight: 800; }
    .dual-panel ul { margin-top: 58px; display: grid; gap: 30px; list-style: none; }
    .dual-panel li { display: flex; align-items: center; gap: 20px; font-size: 44px; font-weight: 800; }
    .dual-panel li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); flex: 0 0 auto; }
    .dual-arrow { align-self: center; height: 4px; background: var(--orange); margin: 0 38px; position: relative; }
    @keyframes arrow-enter { 0% { opacity: 0; transform: translateX(-100%); } 100% { opacity: 1; transform: translateX(0); } }
    .dual-arrow, .framework-bridge, .metric-arrow, .inline-solid-arrow { background: var(--orange); clip-path: polygon(0 34%, 60% 34%, 60% 0, 100% 50%, 60% 100%, 60% 66%, 0 66%); opacity: 0; transform: translateX(-100%); }
    .slide.visible .dual-arrow, .slide.visible .framework-bridge, .slide.visible .metric-arrow, .slide.visible .inline-solid-arrow { animation: arrow-enter 1.5s var(--ease-out-expo) .46s 1 both; }
    .dual-arrow { width: 52px; height: 30px; margin: 0 auto; }

    /* === DEFINITION / QUOTE === */
    .quote-block { position: absolute; left: 150px; right: 220px; top: 340px; padding: 54px 0 54px 72px; border-left: 8px solid var(--orange); font-size: 55px; line-height: 1.45; font-weight: 800; }
    .agenda-row { position: absolute; left: 150px; right: 150px; bottom: 105px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 38px; }
    .agenda-item { border-top: 3px solid var(--line); padding-top: 24px; font-size: 33px; color: var(--muted); }

    /* === CASE FLOW / ACTION / RESULT === */
    .flow-canvas { position: absolute; left: 150px; right: 150px; top: 350px; height: 420px; display: grid; grid-template-columns: 1fr 430px 1fr; align-items: center; }
    .flow-side { display: grid; gap: 24px; }
    .flow-chip { display: flex; align-items: center; gap: 22px; font-size: 37px; font-weight: 800; }
    .flow-line { height: 2px; background: var(--line); flex: 1; }
    .bottleneck { width: 360px; height: 360px; border-radius: 50%; display: grid; place-items: center; text-align: center; background: var(--orange); color: #fff; padding: 56px; font-size: 42px; line-height: 1.35; font-weight: 900; }
    .verified-fact { position: absolute; left: 150px; bottom: 100px; font-size: 33px; color: var(--muted); }
    .steps-row { position: absolute; left: 150px; right: 150px; top: 365px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 42px; }
    .action-step { min-height: 380px; padding-top: 36px; border-top: 3px solid var(--ink); }
    .action-step .step-number { color: var(--orange-pale); font-size: 130px; font-weight: 900; line-height: 1; }
    .action-step .primary { margin-top: 28px; max-width: 430px; }
    .action-footnote { position: absolute; left: 150px; bottom: 100px; font-size: 33px; color: var(--muted); }
    .metric-stage { position: absolute; left: 150px; right: 150px; top: 360px; display: grid; grid-template-columns: 1fr 180px 1fr; align-items: center; text-align: center; }
    .metric-side { padding: 50px 20px; border-top: 3px solid var(--ink); }
    .metric-value { font-size: 94px; line-height: 1; font-weight: 900; }
    .metric-label { margin-top: 32px; font-size: 33px; color: var(--muted); }
    .metric-arrow { width: 52px; height: 30px; margin: 0 auto; font-size: 0; }
    .result-line { position: absolute; left: 150px; bottom: 100px; font-size: 44px; font-weight: 800; }

    /* === TWO-STEP FRAMEWORK === */
    .framework-steps { position: absolute; left: 150px; right: 150px; top: 350px; display: grid; grid-template-columns: 1fr 240px 1fr; align-items: center; }
    .framework-step { position: relative; min-height: 400px; border-top: 3px solid var(--ink); padding-top: 45px; }
    .framework-step .num { position: absolute; right: 0; top: 18px; font-size: 174px; line-height: 1; color: var(--orange-pale); font-weight: 900; letter-spacing: -.08em; }
    .framework-step .primary { position: relative; margin-top: 78px; font-size: 57px; }
    .framework-step .secondary { position: relative; margin-top: 24px; font-size: 35px; }
    .framework-bridge { position: relative; width: 52px; height: 30px; margin: 0 auto; }

    /* === PRINCIPLE SLIDES === */
    .principle-stage { position: absolute; left: 150px; right: 150px; top: 330px; display: grid; grid-template-columns: 470px 1fr; gap: 80px; align-items: center; }
    .ratio-visual { box-sizing: border-box; width: 430px; height: 430px; aspect-ratio: 1 / 1; flex: 0 0 auto; border-radius: 50%; border: 34px solid var(--orange-pale); border-top-color: var(--orange); display: grid; place-items: center; transform: rotate(-25deg); }
    .ratio-visual span { display: block; transform: rotate(25deg); font-size: 90px; line-height: 1; font-weight: 900; white-space: nowrap; }
    .principle-examples { display: grid; gap: 28px; }
    .principle-example { padding: 24px 0; border-bottom: 2px solid var(--line); font-size: 44px; font-weight: 800; }
    .inline-solid-arrow { display: inline-block; width: 34px; height: 19px; margin: 0 16px; vertical-align: -1px; }
    .principle-note { margin-top: 26px; font-size: 33px; color: var(--muted); }
    .schedule-visual { height: 430px; display: grid; grid-template-columns: 185px 42px 185px; gap: 12px; align-items: center; }
    .schedule-column { display: grid; gap: 14px; justify-items: center; }
    .schedule-label { font-size: 22px; color: var(--orange); font-weight: 800; white-space: nowrap; }
    .schedule-frame { position: relative; width: 185px; height: 330px; border: 3px solid var(--ink); background: #fff; overflow: hidden; }
    .schedule-stripe { position: absolute; left: 0; right: 0; background: var(--orange); }
    .schedule-column.before .schedule-stripe:nth-child(1) { top: 4%; height: 5px; }
    .schedule-column.before .schedule-stripe:nth-child(2) { top: 8%; height: 10px; }
    .schedule-column.before .schedule-stripe:nth-child(3) { top: 21%; height: 17px; }
    .schedule-column.before .schedule-stripe:nth-child(4) { top: 34%; height: 7px; }
    .schedule-column.before .schedule-stripe:nth-child(5) { top: 39%; height: 12px; }
    .schedule-column.before .schedule-stripe:nth-child(6) { top: 52%; height: 22px; }
    .schedule-column.before .schedule-stripe:nth-child(7) { top: 66%; height: 8px; }
    .schedule-column.before .schedule-stripe:nth-child(8) { top: 72%; height: 5px; }
    .schedule-column.before .schedule-stripe:nth-child(9) { top: 83%; height: 18px; }
    .schedule-column.before .schedule-stripe:nth-child(10) { top: 94%; height: 6px; }
    .schedule-column.after .schedule-stripe:nth-child(1) { top: 20%; height: 22px; }
    .schedule-column.after .schedule-stripe:nth-child(2) { top: 48%; height: 22px; }
    .schedule-column.after .schedule-stripe:nth-child(3) { top: 76%; height: 22px; }
    .schedule-arrow { width: 42px; height: 24px; background: var(--orange); clip-path: polygon(0 34%, 60% 34%, 60% 0, 100% 50%, 60% 100%, 60% 66%, 0 66%); opacity: 0; transform: translateX(-100%); }
    .slide.visible .schedule-arrow { animation: arrow-enter 1.5s var(--ease-out-expo) .46s 1 both; }

    /* === SCENE CORE / BOUNDARY === */
    .scene-layout { position: absolute; left: 150px; right: 150px; top: 340px; display: grid; grid-template-columns: 460px 1fr; gap: 86px; align-items: start; }
    .scene-symbol { width: 420px; height: 420px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--line); }
    .scene-symbol .icon { width: 150px; height: 150px; }
    .scene-content { display: grid; gap: 22px; }
    .scene-line { padding: 20px 0; border-bottom: 2px solid var(--line); font-size: 44px; font-weight: 800; }
    .scene-method { margin-top: 18px; font-size: 33px; color: var(--orange); font-weight: 800; }
    .boundary-layout { position: absolute; left: 150px; right: 150px; top: 350px; display: grid; grid-template-columns: 1fr 1fr; gap: 84px; }
    .boundary-block { border-top: 3px solid var(--ink); padding-top: 42px; min-height: 360px; }
    .boundary-label { font-size: 33px; color: var(--orange); font-weight: 800; }
    .boundary-main { margin-top: 44px; font-size: 57px; line-height: 1.3; font-weight: 900; }
    .boundary-detail { margin-top: 30px; font-size: 33px; line-height: 1.5; color: var(--muted); }
    .boundary-peers { margin-top: 28px; display: grid; }
    .boundary-peer { padding: 28px 0; border-bottom: 2px solid var(--line); font-size: 48px; line-height: 1.3; font-weight: 900; }
    .action-line { position: absolute; left: 150px; right: 150px; bottom: 100px; display: flex; align-items: center; gap: 24px; font-size: 37px; font-weight: 800; color: var(--orange); }
    .action-line::before { content: ""; width: 62px; height: 6px; border-radius: 99px; background: var(--orange); }

    /* === RELATIONSHIP RINGS === */
    .rings-layout { position: absolute; left: 150px; right: 150px; top: 300px; display: grid; grid-template-columns: 620px 1fr; gap: 90px; align-items: center; }
    .rings { position: relative; width: 590px; height: 590px; }
    .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 3px solid var(--line); border-radius: 50%; display: grid; place-items: start center; padding-top: 14px; font-size: 33px; font-weight: 800; }
    .ring:nth-child(1) { width: 170px; height: 170px; border-color: var(--orange); background: rgba(243,108,33,.08); padding-top: 55px; }
    .ring:nth-child(2) { width: 300px; height: 300px; padding-top: 22px; }
    .ring:nth-child(3) { width: 440px; height: 440px; padding-top: 24px; }
    .ring:nth-child(4) { width: 580px; height: 580px; padding-top: 26px; }
    .ring-legend { display: grid; gap: 22px; }
    .ring-item { display: grid; grid-template-columns: 70px 1fr; gap: 22px; align-items: baseline; padding-bottom: 18px; border-bottom: 2px solid var(--line); }
    .ring-item strong { font-size: 44px; color: var(--orange); }
    .ring-item span { font-size: 33px; color: var(--muted); }

    /* === FIVE-SCENE SYNTHESIS === */
    .resource-row { position: absolute; left: 150px; right: 150px; top: 335px; display: grid; grid-template-columns: repeat(5, 1fr); column-gap: 28px; }
    .resource { position: relative; padding-top: 40px; border-top: 3px solid var(--line); min-height: 430px; }
    .resource::before { content: ""; position: absolute; left: 0; top: -5px; width: 54px; height: 7px; background: var(--orange); border-radius: 99px; }
    .resource .icon { width: 76px; height: 76px; }
    .resource-name { font-size: 42px; font-weight: 900; margin-top: 32px; }
    .resource-focus { font-size: 31px; margin-top: 16px; color: #4f4a43; }
    .resource-boundary { font-size: 31px; margin-top: 62px; color: var(--muted); }
    .resource-boundary strong { display: block; margin-top: 10px; font-size: 42px; color: var(--ink); }

    /* === CLOSING === */
    .closing { display: grid; place-items: center; text-align: center; }
    .closing-inner { width: 1400px; }
    .closing-title { font-size: 123px; line-height: 1.08; font-weight: 900; letter-spacing: -.055em; }
    .closing-subtitle { margin-top: 46px; font-size: 44px; line-height: 1.4; }
    .closing-line { width: 86px; height: 7px; background: var(--orange); margin: 62px auto; border-radius: 99px; }
    .closing-text { font-size: 33px; color: var(--muted); }

    /* === SHARE VERSION CONVERSION SLIDE === */
    .share-intro { position: absolute; left: 150px; right: 150px; top: 350px; max-width: 1420px; font-size: 32px; line-height: 1.55; color: var(--muted); }
    .share-cards { position: absolute; left: 150px; right: 150px; top: 485px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
    .share-card { min-height: 270px; padding: 34px 34px 30px; border-top: 7px solid var(--orange); background: #fffaf6; }
    .share-card .icon { width: 60px; height: 60px; }
    .share-card-title { margin-top: 24px; font-size: 40px; line-height: 1.25; font-weight: 900; }
    .share-card-text { margin-top: 18px; font-size: 27px; line-height: 1.55; color: var(--muted); }
    .share-action { position: absolute; left: 150px; right: 150px; bottom: 82px; display: flex; align-items: center; justify-content: space-between; gap: 34px; }
    .share-action-copy { font-size: 27px; line-height: 1.5; color: var(--muted); }
    .share-button { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; min-width: 390px; min-height: 86px; padding: 20px 42px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 32px; line-height: 1; font-weight: 900; text-decoration: none; box-shadow: 0 16px 36px rgba(243,108,33,.24); }

[{"id":"s01","section":"开场","timeRange":"0'–1'","type":"cover","cue":"晚上好，欢迎来到今天的直播。","narrativeJob":"建立主题与承诺：极简不是空无，而是把资源留给重要的事。","visible":{"eyebrow":"简七直播","title":"极简生活","subtitle":"把选择变清楚，把生活留给重要的事","footer":"5个减法，找回生活掌控感"},"visual":{"layout":"左侧大标题＋右侧留白构图","icons":["sparkles","minus-circle"],"nativeShapes":["橙色细线","留白卡片"],"images":[]},"number":1,"speakerNotes":"晚上好，欢迎来到今天的直播。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"晚上好，欢迎来到今天的直播。","endCue":"开始之前，想先问大家一个问题"},"claims":[]},{"id":"s02","section":"开场","timeRange":"1'–3'","type":"interaction","cue":"开始之前，想先问大家一个问题","narrativeJob":"用弹幕投票把观众带入自己的‘太多’。","visible":{"title":"最近哪一种「太多」，最让你累？","choices":["1 东西","2 消息","3 事情","4 目标","5 难以拒绝"],"prompt":"把数字打在弹幕里"},"visual":{"layout":"五张编号卡片","icons":["package","message-circle","list-checks","target","hand"],"nativeShapes":["编号圆点","选择卡片"],"images":[]},"number":2,"speakerNotes":"开始之前，想先问大家一个问题：最近哪一种「太多」，最让你觉得累？\n\n东西太多，扣1；消息太多，扣2；事情太多，扣3；想做的目标太多，扣4；别人一开口就很难拒绝，扣5。\n\n【停20秒，看弹幕】\n\n我看到1到5都有。大家的生活不一样，可那种感觉很像：每天都在处理事情，重要的部分却总被推到后面。也有朋友说「我全都有」，如果是这样，那今天的内容可能对你格外有用，我们最后会回来看看，你扣的那个数字，到底意味着什么。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"开始之前，想先问大家一个问题","endCue":"今年我在穿衣这件小事上"},"claims":[]},{"id":"s03","section":"开场","timeRange":"3'–6'","type":"story","cue":"今年我在穿衣这件小事上","narrativeJob":"用衣柜故事把抽象极简转成可感知的日常变化。","visible":{"title":"让人疲惫的，常常不是大事","subtitle":"而是无数个一直没有重新判断的小选择","before":["反复比价","反复搭配","闲置累积"],"after":["约10套衣服","场景有答案","早晨更从容"]},"visual":{"layout":"Before / After 双栏","icons":["shirt","tags","clock-3","check-circle-2"],"nativeShapes":["对比箭头","衣柜容量条"],"images":[]},"number":3,"speakerNotes":"今年我在穿衣这件小事上，第一次很具体地感受到「极简」的力量。\n\n年轻的时候，我特别喜欢在购物软件上比价。看到满减会算，看到平台有价差会查，一件衣服从想买到付款，中间能打开好几个页面，反复比较颜色、材质、评价。买回来以后，还要想怎么搭、和哪条裤子配、什么时候穿，有时候一件衣服挂在衣柜里很久，标签都没剪掉。\n\n这些年我搬过十次家，每次都会清掉很多东西，可衣服和杂物还是慢慢堆了起来。平时总觉得「也没多少」，到了装箱的时候才发现，同类物品远比想象中多，很多东西甚至已经想不起是什么时候、为什么买的。\n\n今年我去做了一次色彩测试，把适合自己的色系、搭配和使用场景弄清楚。之后把衣服留到十套左右，工作穿什么，正式场合穿什么，怎么搭配，基本都有了答案。早上不用再站在衣柜前纠结，出门前的十分钟，有一种从容和轻松的感觉。\n\n这件事很小，却让我开始留意：生活里有多少负担，并非来自大事，而是一批不断重复、不断进入、一直没有重新判断的小事。它们单独看都不重，加在一起，就变成了每天的疲惫感。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"今年我在穿衣这件小事上","endCue":"如果你也有这种感受"},"claims":[]},{"id":"s04","section":"开场","timeRange":"6'–7'","type":"definition","cue":"如果你也有这种感受","narrativeJob":"给出定义并预告整场路径。","visible":{"title":"极简，是一套持续判断的方法","quote":"每当新的东西、任务或关系进入生活，都问一句：它值得留下吗？","agenda":["为什么「少」这么难","一个真实的商业案例","两条规律 × 五个场景"]},"visual":{"layout":"定义大字＋三步路径","icons":["filter","briefcase-business","layout-grid"],"nativeShapes":["三段流程线"],"images":[]},"number":4,"speakerNotes":"如果你也有这种感受，今天的主题可能正好适合你。我们来聊聊极简生活。\n\n极简是一套持续判断的方法。每当新的东西、任务或关系进入生活，我们都要问一句：「它值得留下吗？」这套方法既适用于衣柜和房间，也适用于时间、信息、注意力和人际关系。\n\n今天想跟大家聊清楚三件事：为什么我们很难做减法，一个真实的商业案例告诉我们减法怎么做，以及怎么把这套减法方法，落到你我的日常里。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"如果你也有这种感受","endCue":"先来聊聊，我们为什么会把生活塞得这么满"},"claims":[]},{"id":"s05","section":"为什么「少」很难","timeRange":"7'–10'","type":"contrast","cue":"先来聊聊，我们为什么会把生活塞得这么满","narrativeJob":"解释心理机制：忙碌的安全感与小事的即时完成感。","visible":{"title":"忙碌会制造安全感，小事会制造完成感","left":{"label":"看起来","items":["日程排满","待办划掉","即时反馈"]},"right":{"label":"但真正重要的","items":["更难","更慢","短期看不到反馈"]},"footer":"做了很多，不等于推进了重要的事"},"visual":{"layout":"左右对照＋底部结论","icons":["calendar-days","check-square-2","mountain"],"nativeShapes":["对照卡片"],"images":[]},"number":5,"speakerNotes":"先来聊聊，我们为什么会把生活塞得这么满。原因大致有两类：一类来自心理，一类来自行为习惯。\n\n先说心理层面。 忙碌会给人一种安全感。一天排得很满，待办清单很长，我们会感觉自己很重要，也会感觉自己没有浪费时间。停下来反而不安，好像一停下就会被甩下。\n\n同样，小事也容易给人完成感。回一封邮件很快，划掉一个待办事项，买一件衣服、鞋子，那种满足感是即时的。重要的事情常常更难，比如未来五年的规划，需要安静思考，也可能做了很久都看不到反馈。我们很容易先做能马上划掉的小事，一天结束，勾掉很多项目，心里仍然知道，最关键的那件事没有动。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"先来聊聊，我们为什么会把生活塞得这么满","endCue":"再说行为层面。 增加，永远比删除更容易。"},"claims":[]},{"id":"s06","section":"为什么「少」很难","timeRange":"10'–13'","type":"comparison","cue":"**再说行为层面。** 增加，永远比删除更容易。","narrativeJob":"解释行为机制：增加容易，删除意味着承认与放弃。","visible":{"title":"生活变臃肿，因为我们不断增加，却很少重新判断","add":["新东西","新项目","新邀约"],"subtract":["承认买错","接受沉没成本","承担拒绝的不适"],"footer":"长期的轻盈，靠持续判断"},"visual":{"layout":"加法堆叠 vs 减法筛选","icons":["plus","minus","funnel"],"nativeShapes":["堆叠方块","筛选漏斗"],"images":[]},"number":6,"speakerNotes":"再说行为层面。 增加，永远比删除更容易。新衣服看起来挺好看，新项目看起来能赚更多，新邀约拒绝起来又有点不好意思，于是我们不断把新的东西放进来。\n\n做减法，则意味着承认：这件物品买错了，这段付出没有想象中重要。我们会觉得可惜，也会担心自己是不是放弃得太早。\n\n心理上追求确定和完成感，行为上习惯做加法、不习惯做减法，这两股力量合在一起，就是「全部都要」的来源。\n\n生活变得臃肿，是无数次微小选择叠加的结果。一次大扫除只能解决眼前的问题，长期的轻盈，靠的是持续判断。明白了「少」为什么难，接下来我们看一个真实的故事：减法思维如何改变一门生意，也改变一个人的生活。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"再说行为层面。 增加，永远比删除更容易。","endCue":"蒂姆·费里斯是一名创业者"},"claims":[]},{"id":"s07","section":"Tim Ferriss 案例","timeRange":"13'–17'","type":"case-problem","cue":"蒂姆·费里斯是一名创业者","narrativeJob":"建立案例冲突：创始人成为所有决策的唯一瓶颈。","visible":{"eyebrow":"案例｜Tim Ferriss","title":"公司越忙，他越容易成为决策瓶颈","flow":["订单","客服","供应商","退款"],"bottleneck":"大小决定都等他点头","verifiedFact":"当时每天工作约15小时"},"visual":{"layout":"多路流程汇入一个人物节点","icons":["shopping-bag","headphones","truck","badge-dollar-sign","user-round"],"nativeShapes":["流程连线","瓶颈警示"],"images":[]},"claims":[{"text":"2004年前后每天工作15小时、因工作狂状态结束一段重要关系","status":"verified","sourceIds":["src-tim-17q"]},{"text":"每周90小时、闹钟跨时区反复响、印度远程助理、仓鼠原话","status":"needs_verification","sourceIds":[]}],"number":7,"speakerNotes":"【内容核验提示】\n- 每周90小时、闹钟跨时区反复响、印度远程助理、仓鼠原话（needs_verification）\n\n蒂姆·费里斯是一名创业者，写过畅销书《每周工作四小时》，现在也是知名播客主理人。可在创业初期，他曾经忙到接近崩溃。\n\n2001年前后，他还在硅谷一家创业公司上班，业余时间捣鼓出一个小生意，成长得很快，卖到了十几个国家。\n\n当时他没有全职员工，生产、物流和客服都交给世界各地的外包公司，还请了印度的远程助理。可他追求完美，也不敢放权，于是只定了一条规则：遇到任何问题，都要先发邮件请示，等他点头以后再处理。\n\n订单出错找他，客户投诉找他，广告和供应商出了问题，最后还是找他。公司里大大小小的决定，几乎都要等他点头，哪怕只是一个几十块钱的退款。\n\n因为生意横跨多个时区，他的闹钟每隔几小时就会响一次，去处理来自欧洲、亚洲和美国的邮件。\n\n到了2004年，蒂姆的身体和精神都到了极限，他每天工作15小时，一周连轴转90小时。这种高压状态让他当时准备结婚的女友最终选择了离开，他在日记里写道：「我感觉自己像一个在跑步机上被调到了最高档，却找不到关机键的仓鼠。」\n\n同一年，好友离世和感情破裂接连发生。蒂姆决定离开原来的节奏，买了一张飞往伦敦的单程机票。\n\n[Sources]\n- https://tim.blog/2016/12/07/testing-the-impossible-17-questions-that-changed-my-life/","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"蒂姆·费里斯是一名创业者","endCue":"出发前，他开始了一场极致的极简。"}},{"id":"s08","section":"Tim Ferriss 案例","timeRange":"17'–19'","type":"case-action","cue":"出发前，他开始了一场极致的极简。","narrativeJob":"展示减法动作：清除高消耗客户、标准化、授权。","visible":{"title":"减法从三件事开始","steps":["停止服务高消耗、低贡献客户","把订单流程标准化","把小额决策权交出去"],"footnote":"授权门槛：$500"},"visual":{"layout":"三张动作卡＋向右推进","icons":["user-x","workflow","badge-check"],"nativeShapes":["三步箭头"],"images":[]},"claims":[{"text":"授权最初低于100美元，之后提高到500美元、1000美元","status":"verified","sourceIds":["src-tim-17q"]},{"text":"原稿写成一开始授权500美元","status":"source_discrepancy","sourceIds":["src-tim-17q"]}],"number":8,"speakerNotes":"【内容核验提示】\n- 原稿写成一开始授权500美元（source_discrepancy）\n\n出发前，他开始了一场极致的极简。先是发邮件给那些麻烦、但贡献度低的客户，告诉他们「我不再提供服务了」。\n\n接着，他给外包的远程助理发了一封邮件，授权了500美金以下的决策，不需要请示。\n\n[Sources]\n- https://tim.blog/2016/12/07/testing-the-impossible-17-questions-that-changed-my-life/","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"出发前，他开始了一场极致的极简。","endCue":"一个月后，当他战战兢兢地打开邮箱"}},{"id":"s09","section":"Tim Ferriss 案例","timeRange":"19'–21'","type":"case-result","cue":"一个月后，当他战战兢兢地打开邮箱","narrativeJob":"收束案例：授权后系统更顺，个人工作负担显著下降。","visible":{"title":"当决策不再堵在一个人身上，系统反而更顺","metric":{"before":"每周80-90小时","after":"每周4小时","label":"工作量"},"conclusion":"责任与边界，比事事审批更有效"},"visual":{"layout":"大数字 Before → After","icons":["timer-off","gauge","users-round"],"nativeShapes":["下降曲线","结果徽章"],"images":[]},"claims":[{"text":"案例页面按直播口径呈现为每周80-90小时到每周4小时","status":"needs_verification","sourceIds":[]},{"text":"一个月后利润增长40%","status":"needs_verification","sourceIds":[]},{"text":"单程飞往伦敦、好友离世与时间关系","status":"needs_verification","sourceIds":[]}],"number":9,"speakerNotes":"【内容核验提示】\n- 案例页面按直播口径呈现为每周80-90小时到每周4小时（needs_verification）\n- 一个月后利润增长40%（needs_verification）\n- 单程飞往伦敦、好友离世与时间关系（needs_verification）\n\n一个月后，当他战战兢兢地打开邮箱，准备迎接公司破产的惨状时，他愣住了。\n\n公司不仅没倒闭，反而运转得比他在办公室坐阵时还要顺畅。因为员工和供应商不再需要等待他的审批，处理问题的效率反而提高了。\n\n最神奇的是，那个月的利润居然增长了40%。\n\n他第一次真正拥有了属于自己的时间，这正是《每周工作四小时》这本书名的来历。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"一个月后，当他战战兢兢地打开邮箱","endCue":"回头看，我做色彩测试"}},{"id":"s10","section":"两条规律","timeRange":"21'–22'","type":"framework","cue":"回头看，我做色彩测试","narrativeJob":"把故事抽象为可复用的两步框架。","visible":{"title":"两步减法","steps":[{"number":"01","title":"看清核心","subtitle":"找到关键少数"},{"number":"02","title":"设定上限","subtitle":"约束其余部分"}]},"visual":{"layout":"左右两步大卡","icons":["search-check","panel-top-close"],"nativeShapes":["01/02 大数字","连接箭头"],"images":[]},"number":10,"speakerNotes":"回头看，我做色彩测试，和费里斯重整公司的做法，用的是同一套底层逻辑，可以拆成两步：第一步，看清核心；第二步，给其余部分设定上限。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"回头看，我做色彩测试","endCue":"我们先来看第一步：找关键，利用二八法则。"},"claims":[]},{"id":"s11","section":"两条规律","timeRange":"22'–27'","type":"principle","cue":"我们先来看第一步：**找关键，利用二八法则。**","narrativeJob":"解释二八法则是观察价值分布的方法，而非机械算比例。","visible":{"eyebrow":"规律 01｜二八法则","title":"寻找持续产生大部分价值的少数","examples":["少数客户 → 大部分利润","少数任务 → 主要成果","少数衣服 → 高频使用"],"footnote":"20%不必精确计算，它是一种观察方法"},"visual":{"layout":"20 / 80 大比例图＋三例","icons":["pie-chart","briefcase","shirt"],"nativeShapes":["20/80 环形比例","价值高亮"],"images":[]},"claims":[{"text":"帕累托原则常用于识别少数原因产生大部分结果","status":"verified","sourceIds":["src-juran-pareto"]}],"number":11,"speakerNotes":"我们先来看第一步：找关键，利用二八法则。\n\n大家可能都听过帕累托定律，也就是「二八法则」。它提醒我们一个事实：这个世界上的很多结果，本来就不是平均产生的。少数客户可能贡献大部分利润，少数任务可能承担主要价值。\n\n在蒂姆的生意里，少数优质客户贡献了大部分利润，另一批客户占用了大量时间，带来的价值却很有限。他清理的，正是这些高消耗、低回报的工作。\n\n放在日常也很好懂：衣柜里真正高频穿的，可能只有几套；工作中真正推动结果的，可能只是几项任务；微信好友上千人，能在你难过时给你安慰、在事业上给你启发的，可能也就是那20%。\n\n对了，这里的20%不需要精确计算，它是一种观察方法，让你对那些少数、但持续产生了大部分价值的事情，保持敏感度。\n\n除了看得见的数据，我们有时也很难判断自己的「关键少数」在哪里。这时，可以借助专业人士或AI，帮助我们更快看清重点。\n\n比如色彩诊断、或者请教某个行业的业内人士，付出一笔费用换来的答案，本质上就是一种投资。它帮你省掉了未来十年，可能买错的几十件衣服，也省下了无数次纠结和精神内耗。\n\n[Sources]\n- https://www.juran.com/blog/a-guide-to-the-pareto-principle-80-20-rule-pareto-analysis/","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"我们先来看第一步：找关键，利用二八法则。","endCue":"第二步，给剩下的设一个上限：警惕帕金森法则。"}},{"id":"s12","section":"两条规律","timeRange":"27'–31'","type":"principle","cue":"**第二步，给剩下的设一个上限：警惕帕金森法则。**","narrativeJob":"解释任务如何填满可用空间，并给出边界思维。","visible":{"eyebrow":"规律 02｜帕金森法则","title":"边界越模糊，事情越容易膨胀","examples":["一下午的报告 → 拖到下班","一小时的会议 → 被废话填满","全天开着邮箱 → 注意力被切碎"],"conclusion":"减法的重点，是提前设限"},"visual":{"layout":"容器被逐渐填满的三段图","icons":["file-clock","users","mail"],"nativeShapes":["时间容器","膨胀动画预留"],"images":[]},"claims":[{"text":"工作会扩张以填满可用时间","status":"verified","sourceIds":["src-parkinson"]},{"text":"Tim每天只在下午4点处理半小时邮件","status":"needs_verification","sourceIds":[]}],"number":12,"speakerNotes":"【内容核验提示】\n- Tim每天只在下午4点处理半小时邮件（needs_verification）\n\n第二步，给剩下的设一个上限：警惕帕金森法则。\n\n好，聊完了如何通过「二八法则」找到那核心的20%，接下来的问题更关键：剩下的那80%怎么办？\n\n那些优先级没那么高、又必须处理的杂事、琐事和人情，该怎么安排？这就要用到第二条规律：给其余部分设一个上限，也就是警惕「帕金森法则」。\n\n帕金森法则说的是：事情会不断膨胀，直到填满你为它准备的所有空间。\n\n如果你给自己一整个下午去写一份报告，你通常就会磨蹭到下班前最后一分钟才写完；\n\n如果你给一场会议设定一小时，哪怕大家十分钟就聊完了正事，剩下的五十分钟也会被废话填满。\n\n蒂姆·费里斯处理邮件时也发现，只要收件箱整天开着，新消息就会不断涌进来，一天很快就被邮件填满。\n\n于是他给自己划了一个硬性上限：每天只在下午4点集中处理半小时邮件。\n\n过了这半小时，他都强行关掉电脑。结果，他发现那些所谓的「紧急事件」，在没有他的回复下，竟然大半都自动消失了，或者被别人处理好了。\n\n所以，减法的重点在于提前设限。未来可能不断进入生活的东西、任务和信息，都需要一道清楚的边界。\n\n[Sources]\n- https://pmc.ncbi.nlm.nih.gov/articles/PMC2565709/","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"第二步，给剩下的设一个上限：警惕帕金森法则。","endCue":"这两条规律听起来简单"}},{"id":"s13","section":"互动","timeRange":"31'–32'","type":"interaction","cue":"这两条规律听起来简单","narrativeJob":"第二次互动，让观众选择自己的切入口。","visible":{"eyebrow":"互动","title":"如果今晚先做一件减法，打算从哪里开始？","prompt":"请在弹幕中分享你的想法"},"visual":{"layout":"问题＋弹幕引导框","icons":["message-circle"],"nativeShapes":["虚线弹幕引导框"],"images":[]},"number":13,"speakerNotes":"这两条规律听起来简单，放进生活里，难点才会出现。现在请大家想一想：\n\n如果今晚只能选一件事先动手，你最想先做减法的，会是家里的哪个角落，还是手机里的哪个APP？打在弹幕里，让我看看大家都想从哪里开始。\n\n【停15秒，看弹幕】","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"这两条规律听起来简单","endCue":"好，刚才弹幕里有人说"},"claims":[]},{"id":"s14","section":"五个场景","timeRange":"32'–37'","type":"scene-core","cue":"好，刚才弹幕里有人说","narrativeJob":"物质减法：从‘留下什么’开始，并让数量可见。","visible":{"eyebrow":"01｜物质减法","title":"先问：我现在想留下什么？","questions":["现在常去哪些场合？","哪些颜色穿上舒服？","哪些东西总会先伸手去拿？"],"method":"同类集中，数量可见"},"visual":{"layout":"中心问题＋三条判断","icons":["shirt","palette","hand-pointer","scan-eye"],"nativeShapes":["聚合圆","数量标签"],"images":[]},"number":14,"speakerNotes":"好，刚才弹幕里有人说，最想清理的是衣柜；也有人说，自己最累的地方在关系里，别人一开口，就习惯先答应。\n\n你看，表面上是不同的问题，背后都在问：有限的空间、时间和心力，该留给什么？\n\n接下来我们就按五个场景慢慢拆。每个场景都走两步：先看核心，找出值得留下的少数；再设边界，给其余部分规定容量。我也会给大家留一个「今晚就做」的小动作。\n\n先看核心。整理时，我们很容易从「扔」开始。十分钟过去，床上堆满衣服，人先累了。所以换一个问法：「我现在想留下什么？」\n\n把目光放在今天的生活上。你现在常去哪些场合？什么颜色穿上舒服？哪些衣服洗完以后，你总会先伸手去拿？这些答案，就是衣柜里的核心。\n\n具体整理时，可以按类别来。今天就看衣服，明天只看书，文件和纪念品放到后面。\n\n把同类东西放到一起，会发现：你一直以为自己缺白衬衫，结果已经囤了7件；以为家里没有充电线，抽屉里却绕着十几根。数量一旦看得见，选择就容易了。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"好，刚才弹幕里有人说","endCue":"整理出来之后，怎么处理呢？"},"claims":[]},{"id":"s15","section":"五个场景","timeRange":"37'–40'","type":"scene-boundary","cue":"**整理出来之后，怎么处理呢？**","narrativeJob":"物质减法：给闲置找去处，用容量规则保持结果。","visible":{"eyebrow":"01｜物质减法","title":"容量比意志更可靠","boundary":"一进一出","boundaryDetail":"","action":"今晚：选一个小类别，集中到一处，整理15分钟","actionDetail":"杯子；数据线","examples":["T恤","杯子","数据线"]},"visual":{"layout":"规则大字＋行动清单","icons":["arrow-left-right","package-open","timer"],"nativeShapes":["容量框","进出箭头"],"images":[]},"number":15,"speakerNotes":"整理出来之后，怎么处理呢？我们的社群，最近就在讨论这个话题。\n\n拿小朋友的绘本来说，一个朋友提到，可以分类打包、拍张照片，直接发到小区或附近的闲置群里，低价出，谁需要谁自取。\n\n衣服方面，有位小伙伴分享，她无意中看到有水灾地区的图书馆发布物资需求信息，直接把家里闲置的衣服被子打包寄了过去。这样既清空了家里的空间，又帮到了真正需要的人，很有成就感。\n\n这类做法都值得参考。先替闲置物品找到去处，整理时也会更安心。\n\n再设边界。清完一次只是开始，容量决定它能不能保持。我推荐「一进一出」法则：买一件新东西，就处理掉一件旧的。\n\n以后买东西，就变成了很具体的容量题：它进来以后，谁出去呢？这个问题能挡住很多随手下单。\n\n这样一来，家里留下的，都是你愿意使用、也乐于看见的东西。每天回到家，空间会给你一种清爽、安定的感觉。\n\n今晚就做：选一个小类别，T恤、杯子、数据线都可以，全部集中到一处，给自己15分钟整理。\n\n你会得到一个很直接的反馈：东西更清爽，头脑也更清晰。\n\n你可以在弹幕聊聊，准备清理哪一类呢？","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"整理出来之后，怎么处理呢？","endCue":"先看核心。再说手机。"},"claims":[]},{"id":"s16","section":"五个场景","timeRange":"40'–42'","type":"scene-core","cue":"**先看核心。**再说手机。","narrativeJob":"数字减法：先定义必需工具，再安排空出来的时间。","visible":{"eyebrow":"02｜数字减法","title":"先决定：手机真正需要保留什么？","method":"30天数字清理","steps":["列出工作与生活需要的工具","暂停其余应用","提前安排空出来的时间","只装回确实有价值的工具"]},"visual":{"layout":"手机轮廓＋四步清理","icons":["smartphone","pause","footprints","download"],"nativeShapes":["手机屏幕","应用格子"],"images":[]},"number":16,"speakerNotes":"先看核心。再说手机。很多人一天醒来的第一个动作，就是摸手机。原本只想看时间，顺手点开一条消息，又滑到群聊，再看一眼短视频。等回过神，十几分钟过去了。\n\n如果你觉得自己已经被手机牵着走，可以试一次30天数字清理。先列出工作和生活必需的工具，其余应用暂停使用。\n\n空出来的时间，要提前安排去处：散步、运动、看书、做饭、约朋友见面。前三天可能很不习惯，手会自动去摸手机；过一阵子，你会重新感受到完整的十分钟、半小时、一整个晚上。\n\n三十天后，再把确实有价值的工具装回来，并给它一条使用规则。比如短视频只在周末看，社交软件只在电脑上打开，新闻每天看一次。选择权回到手里，手机就安静了。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"先看核心。再说手机。","endCue":"再设边界。通知是最值得先处理的入口。"},"claims":[]},{"id":"s17","section":"五个场景","timeRange":"42'–44'","type":"scene-boundary","cue":"**再设边界。**通知是最值得先处理的入口。","narrativeJob":"数字减法：关闭低价值入口，集中处理消息。","visible":{"eyebrow":"02｜数字减法","title":"注意力需要入口边界","boundaries":["关掉低价值通知","上午11点、下午4点集中处理消息"],"action":"今晚：关3个通知＋移走1个沉迷 App＋30分钟无屏幕"},"visual":{"layout":"通知流被闸门截断","icons":["bell-off","clock","screen-share-off"],"nativeShapes":["通知气泡","边界闸门"],"images":[]},"number":17,"speakerNotes":"再设边界。通知是最值得先处理的入口。外卖折扣、新闻推送、群聊里的每一句话，都在占据你的注意力。\n\n你可以关掉低价值通知；消息也可以集中处理，比如上午11点一次，下午4点一次。\n\n通知少了，注意力就能保持完整，深度思考也更容易发生。\n\n今晚就做：关掉三个最常打断你的通知，把一个容易让你沉迷的软件移出首页，再给自己留半小时无屏幕时间。半小时里做什么都可以，喝茶、洗澡、收拾桌面、和家人聊几句。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"再设边界。通知是最值得先处理的入口。","endCue":"先看核心。第三个场景是消费。"},"claims":[]},{"id":"s18","section":"五个场景","timeRange":"44'–46'","type":"scene-core","cue":"**先看核心。**第三个场景是消费。","narrativeJob":"消费减法：从购买目的和生命时间重新判断价值。","visible":{"eyebrow":"03｜消费减法","title":"把价格换算成生命时间","question":"这笔钱想换回什么？","values":["健康","成长","节省时间","长期使用"],"formula":"300元 ÷ 50元/小时 = 6小时工作时间"},"visual":{"layout":"价格 → 时间换算器","icons":["wallet-cards","arrow-right","hourglass"],"nativeShapes":["公式卡","时间刻度"],"images":[]},"number":18,"speakerNotes":"先看核心。第三个场景是消费。很多购买发生得很快：刷到一件衣服，主播说只剩最后几分钟；朋友推荐一款小家电，马上冒出一句：「也许我也需要。」\n\n所以买之前，可以先问：这笔钱想换回什么？健康、成长、节省时间、长期使用价值，还是一次短暂的新鲜感？目的越清楚，花钱越有方向。\n\n有一个很直接的换算方法：把价格换成时间。先算自己的实际时薪。用实际到手的收入，扣掉通勤、工作餐、服装等工作相关支出，再除以工作、加班、通勤和准备所花的总时间。假设算下来一小时50块，一件300块的衣服，就等于6个小时。到这里再问一句：「我愿意用工作6个小时换它吗？」\n\n价格变成时间以后，钱和生活的关系会清楚很多。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"先看核心。第三个场景是消费。","endCue":"再设边界。消费额度可以提前安排。"},"claims":[]},{"id":"s19","section":"五个场景","timeRange":"46'–48'","type":"scene-boundary","cue":"**再设边界。**消费额度可以提前安排。","narrativeJob":"消费减法：先分配储蓄和固定支出，再给非必需品冷静期。","visible":{"eyebrow":"03｜消费减法","title":"先安排预算，再决定消费","boundaryPeers":["消费=工资-储蓄","非必需品：48小时冷静期"],"action":"今晚：把购物车里1件商品换算成工作时间"},"visual":{"layout":"资金分流＋48小时计时","icons":["split","piggy-bank","timer-reset"],"nativeShapes":["资金流向","倒计时环"],"images":[]},"number":19,"speakerNotes":"再设边界。消费额度可以提前安排。（消费=工资-储蓄）工资到账后，先划出储蓄、投资和固定支出，剩余金额就是这个月可以自由使用的钱。\n\n非必需品再加一个48小时冷静期。两天以后再看，热度退下去，需求会变得更清楚。\n\n极简消费，追求的是每一笔支出都有位置，每一件买回来的东西都能进入生活。\n\n今晚就做：打开购物车，挑一件非必需品，把价格换算成自己的工作时间。48小时后再看一次，如果你仍然清楚它会怎么被使用，就安心做决定。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"再设边界。消费额度可以提前安排。","endCue":"先看核心。第四个场景是心理。"},"claims":[]},{"id":"s20","section":"五个场景","timeRange":"48'–50'","type":"scene-core","cue":"**先看核心。**第四个场景是心理。","narrativeJob":"心理减法：识别念头，再把注意力带回当下。","visible":{"eyebrow":"04｜心理减法","title":"不必处理每一个冒出来的念头","practice":["看见：我在担心","回来：回到呼吸","重复：走神十次，就回来十次"],"footer":"把注意力带回此刻能处理的部分"},"visual":{"layout":"念头气泡 → 呼吸锚点","icons":["brain","wind","rotate-ccw"],"nativeShapes":["呼吸圆环","淡出气泡"],"images":[]},"number":20,"speakerNotes":"先看核心。第四个场景是心理。人坐在沙发上，大脑却还在忙：明天的会议、孩子的安排、没回的消息，一件接一件地冒出来。疲惫感就是这样慢慢积累的。\n\n心理减法的第一步，是把注意力带回此刻能处理的部分。身体累了，就先休息；感觉紧张，就做三次缓慢的深呼吸，让身体一点点放松下来。\n\n我最近一直在练习两件事：冥想和瑜伽。\n\n冥想可以理解成一次很简单的注意力练习。坐好，感受呼吸。过几秒，脑子开始想别的：「刚才那句话是不是说错了？」看见以后，在心里轻轻说一句：「我在担心。」然后回到呼吸。走神十次，就回来十次。\n\n练瑜伽也一样。脚掌踩在哪里，哪一块肌肉在用力，呼吸有没有变急促，注意力落在身体上，大脑里的声音就会慢下来。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"先看核心。第四个场景是心理。","endCue":"再设边界。很多人一开始练习"},"claims":[]},{"id":"s21","section":"五个场景","timeRange":"50'–52'","type":"scene-boundary","cue":"**再设边界。**很多人一开始练习","narrativeJob":"心理减法：降低标准，让练习能进入生活并持续。","visible":{"eyebrow":"04｜心理减法","title":"降低标准，让练习进入生活","examples":["每天5分钟冥想","每周2次基础运动","结束时身体还有余力"],"action":"今晚：手机放远，数10次呼吸"},"visual":{"layout":"高门槛跨不过 → 低台阶可持续","icons":["stairs","meditation","heart-pulse"],"nativeShapes":["高低门槛对比"],"images":[]},"number":21,"speakerNotes":"再设边界。很多人一开始练习，就给自己定得很满：每天半小时冥想，一周运动五次，一个月要看到明显变化。目标一高，一天落下，心里马上出现挫败感。\n\n可以把标准降到轻松完成：每天5分钟冥想，每周两次基础运动，结束时身体还有余力。低一点的门槛，会让练习自然进入生活。\n\n我产后身体还没完全恢复时，也经历过这个过程。那时候看到别人能做很漂亮的体式，心里会着急，总觉得自己也应该快一点。后来换了一位专门教基础动作的老师，她反复提醒我：「今天把呼吸做好，把这个动作做稳，就够了。」动作简单下来，身体反而恢复得更好，我也更愿意继续。那段经历让我明白，减掉过高的标准，坚持的复利才有可能发生。\n\n今晚就做：睡前给自己5分钟。手机放远一点，坐着或躺着都可以，数十次呼吸。走神了，觉察到了，就轻轻回到呼吸，把注意力带回此刻。未来的事，留到它到来的时候再处理。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"再设边界。很多人一开始练习","endCue":"先看核心。人类学家邓巴做过一项很有意思的研究"},"claims":[]},{"id":"s22","section":"五个场景","timeRange":"52'–54'","type":"diagram","cue":"**先看核心。**人类学家邓巴做过一项很有意思的研究","narrativeJob":"关系减法：用关系层级说明投入天然不平均。","visible":{"eyebrow":"05｜关系减法","title":"关系本来就有层次","rings":[{"n":"5","label":"最核心支持"},{"n":"15","label":"主要亲密关系"},{"n":"50","label":"较稳定社交圈"},{"n":"150","label":"稳定关系上限参考"}],"footnote":"数字是参考，重点是时间与心力应集中在更靠近自己的层级"},"visual":{"layout":"同心圆关系层级图","icons":["heart-handshake","users-round"],"nativeShapes":["5/15/50/150 同心圆"],"images":[]},"claims":[{"text":"个人关系网络常呈约5、15、50、150的层级结构","status":"verified","sourceIds":["src-dunbar-oxford"]}],"number":22,"speakerNotes":"先看核心。人类学家邓巴做过一项很有意思的研究：一个人能维持稳定关系的人数上限，大约是150人。\n\n这150人往里还能继续分层：\n\n最核心的，大约是5个人，这是你遇到麻烦时第一时间会想到、也会无条件支持你的人；\n\n往外一层，大约15个人，是你愿意花时间一起吃饭、旅行、说真心话的主要社交对象；\n\n再往外，是大约50人的熟人圈，可能出现在你的家庭聚会、同学聚会里；\n\n最外层才是完整的150人。\n\n数字只是一种参考。它提醒我们，能长期投入时间和心力的关系，通常集中在最靠近自己的几层。\n\n社群里有位朋友最近开始动笔写关于长辈的回忆录，已经完成了两篇。她原本担心自己写不出那种年代感，没想到一旦加入具体细节，内容自然就变得饱满。\n\n这其实是一种「关系上的减法」：不再把时间分散在很多应酬饭局上，而是集中精力，深挖那几位重要的人的故事，这份投入更花时间，但产生的价值，能留存很久。\n\n[Sources]\n- https://ora.ox.ac.uk/objects/uuid%3A6b3006c1-a7bd-4a67-8c5b-31f628676a3c","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"先看核心。人类学家邓巴做过一项很有意思的研究","endCue":"再设边界。面对"}},{"id":"s23","section":"五个场景","timeRange":"54'–56'","type":"scene-boundary","cue":"**再设边界。**面对","narrativeJob":"关系减法：主动分配有限时间，形成一个投入与一个拒绝动作。","visible":{"eyebrow":"05｜关系减法","title":"拒绝一个低价值邀约，把完整陪伴留给重要的人","checks":["这段关系值得投入多少？","我现在有没有余量？"],"action":"今晚：联系1个重要的人，或婉拒1个确定不参加的邀约"},"visual":{"layout":"时间从分散流向核心关系","icons":["message-heart","calendar-x","clock-arrow-down"],"nativeShapes":["时间流向","关系卡片"],"images":[]},"number":23,"speakerNotes":"再设边界。面对「顺便帮个忙」「不太熟的饭局」，先停一下，想想这段关系值得你投入多少时间和精力，也看看自己眼下有没有余量。\n\n可能有人会觉得，这样是不是太功利了？但换个角度看，时间和精力本来就是有限的，你不主动分配，它也会被别人、被琐事替你分配。把心力留给真正珍视的人，让陪伴配得上它本该有的分量。\n\n今晚就做：给一个重要的人发条信息；或者婉拒一个你已经确定不参加的邀约。一个动作把时间留给重要的人，另一个动作把时间收回自己手里。你最近最想认真陪谁吃一顿饭？","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"再设边界。面对","endCue":"好啦，五个场景走完了。"},"claims":[]},{"id":"s24","section":"总结","timeRange":"56'","type":"synthesis","cue":"好啦，五个场景走完了。","narrativeJob":"把五个场景压缩成一张可复习的总图。","visible":{"title":"五种减法，把有限资源还给重要的部分","grid":[{"scene":"物质","focus":"看使用","boundary":"空间"},{"scene":"数字","focus":"看价值","boundary":"注意力"},{"scene":"消费","focus":"看回报","boundary":"金钱"},{"scene":"心理","focus":"看当下","boundary":"心力"},{"scene":"关系","focus":"看珍视","boundary":"时间"}]},"visual":{"layout":"五列总结矩阵","icons":["package","smartphone","wallet","brain","users"],"nativeShapes":["五列卡片","资源边界条"],"images":[]},"number":24,"speakerNotes":"好啦，五个场景走完了。你会发现，减法落到生活里，没有想象中那么抽象。物质看使用，数字看价值，消费看回报，心理看当下，关系看珍视；然后给空间、注意力、金钱、心力和时间各设一道边界。\n\n这五件事也会互相影响：东西少一点，消费会更谨慎；通知少一点，心会更安静；内心有余地，陪伴别人时也会更完整。","sourceMap":{"sourceDocument":"直播主题：极简生活｜把选择变清楚，把生活留给重要的事.md","startCue":"好啦，五个场景走完了。","endCue":"今晚，我们从蒂姆·费里斯的商业实验里"},"claims":[]},{"id":"s25","section":"结尾","timeRange":"56'–60'","type":"closing","cue":"今晚，我们从蒂姆·费里斯的商业实验里","narrativeJob":"回收两条规律并给出温和、可行动的收尾。","visible":{"title":"删去干扰，留下重点","subtitle":"把有限的资源，留给价值更高的部分","closing":     /* === TEXT AND CONTENT HELPERS === */
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

    const formatTitle = (title, forceLong = false) => {

      if (!forceLong && !isLongTitle(value)) return escapeHtml(value);

      const target = value.length / 2;
      const splitAt = breaks.length ? breaks.sort((a, b) => Math.abs(a - target) - Math.abs(b - target))[0] : Math.ceil(target);

      setupStageScale() {
        const scale = () => {
          const mobilePortrait = window.matchMedia('(max-width: 700px) and (orientation: portrait)').matches;
          const designWidth = mobilePortrait ? 1080 : 1920;
          const designHeight = mobilePortrait ? 1920 : 1080;
          const factor = Math.min(window.innerWidth / designWidth, window.innerHeight / designHeight);
          const x = (window.innerWidth - designWidth * factor) / 2;
          const y = (window.innerHeight - designHeight * factor) / 2;
          this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener('resize', scale);
      }

      setupKeyboardNav() {
        document.addEventListener('keydown', event => {
          if (event.target.getAttribute?.('contenteditable') === 'true') return;
          if (['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)) { event.preventDefault(); this.next(); }
          if (['ArrowLeft','ArrowUp','PageUp'].includes(event.key)) { event.preventDefault(); this.prev(); }
          if (event.key === 'Home') this.showSlide(0);
          if (event.key === 'End') this.showSlide(this.slides.length - 1);
          if (event.key.toLowerCase() === 'f') this.toggleFullscreen();
        });
      }

      setupTouchNav() {
        document.addEventListener('touchstart', event => {
          this.touchStartX = event.changedTouches[0].screenX;
          this.touchStartY = event.changedTouches[0].screenY;
        }, {passive:true});
        document.addEventListener('touchend', event => {
          const deltaX = event.changedTouches[0].screenX - this.touchStartX;
          const deltaY = event.changedTouches[0].screenY - this.touchStartY;
          const absX = Math.abs(deltaX);
          const absY = Math.abs(deltaY);
          if (absY > 55 && absY > absX) {
            deltaY < 0 ? this.next() : this.prev();
          } else if (absX > 55) {
            deltaX < 0 ? this.next() : this.prev();
          }
        }, {passive:true});
      }

      setupWheelNav() {
        document.addEventListener('wheel', event => {
          if (this.wheelLocked || Math.abs(event.deltaY) < 20) return;
          this.wheelLocked = true;
          event.deltaY > 0 ? this.next() : this.prev();
          setTimeout(() => { this.wheelLocked = false; }, 1550);
        }, {passive:true});
      }

      next() { this.showSlide(Math.min(this.currentSlide + 1, this.slides.length - 1)); }
      prev() { this.showSlide(Math.max(this.currentSlide - 1, 0)); }

      showSlide(index) {
        this.currentSlide = index;
        this.slides.forEach((slide, i) => {
          slide.classList.toggle('active', i === index);
          slide.classList.toggle('visible', i === index);
        });
        document.getElementById('globalBrand').classList.toggle('hidden', index === 0);
        document.getElementById('globalBrand').classList.toggle('stacked', index > 0 && (deckData.slides[index].id === 's05' || isLongTitle(deckData.slides[index].visible.title || '')));
        history.replaceState(null, '', `#${index + 1}`);
      }

      async toggleFullscreen() { if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.(); else await document.exitFullscreen?.(); }
    }

    const initial = Math.max(0, Math.min(Number(location.hash.slice(1) || 1) - 1, deckData.slides.length - 1));
    const presentation = new SlidePresentation();
    presentation.showSlide(initial);

    window.__deckReady = true;
  </script>
</body>
</html>
